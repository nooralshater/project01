<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <form>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required minlength="3">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <input type="radio" id="blue" name="team" value="blue" required>
        <label for="blue">Blue Team</label>

        <input type="radio" id="red" name="team" value="red">
        <label for="red">Red Team</label>

        <input type="checkbox" id="agreement" name="agreement" required>
        <label for="agreement">I agree to the terms and conditions</label>

        <label for="level">Experience Level</label>
        <select id="level" name="level" required>
            <option value="">Select an option</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <label for="message">Additional Information</label>
        <textarea id="message" name="message" required minlength="10"></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
